<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="1" stop-color="#101226"/>
    </linearGradient>
    <linearGradient id="path" x1="130" y1="0" x2="1070" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="26" fill="url(#bg2)"/>
  <rect x="1" y="1" width="1198" height="258" rx="25" stroke="#22304A" stroke-width="2"/>

  <text x="600" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4" fill="#94A3B8">CONTINUOUS DEVELOPMENT LOOP</text>

  <path d="M150 142 H1050" stroke="#1E293B" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 142 H1050" stroke="url(#path)" stroke-width="5" stroke-linecap="round" stroke-dasharray="190 710" filter="url(#glow2)">
    <animate attributeName="stroke-dashoffset" values="0;-900" dur="4.8s" repeatCount="indefinite"/>
  </path>

  <!-- Connectors -->
  <g stroke="#334155" stroke-width="2">
    <path d="M200 142 V95"/>
    <path d="M470 142 V95"/>
    <path d="M740 142 V95"/>
    <path d="M1000 142 V95"/>
  </g>

  <!-- Nodes -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g>
      <circle cx="200" cy="142" r="25" fill="#0F172A" stroke="#22D3EE" stroke-width="3"/>
      <circle cx="200" cy="142" r="8" fill="#22D3EE">
        <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="200" y="86" font-size="22" font-weight="700" fill="#E2E8F0">LEARN</text>
      <text x="200" y="204" font-size="15" fill="#94A3B8">Understand the problem</text>
    </g>

    <g>
      <circle cx="470" cy="142" r="25" fill="#0F172A" stroke="#60A5FA" stroke-width="3"/>
      <circle cx="470" cy="142" r="8" fill="#60A5FA">
        <animate attributeName="r" values="7;11;7" dur="2s" begin=".5s" repeatCount="indefinite"/>
      </circle>
      <text x="470" y="86" font-size="22" font-weight="700" fill="#E2E8F0">BUILD</text>
      <text x="470" y="204" font-size="15" fill="#94A3B8">Turn ideas into code</text>
    </g>

    <g>
      <circle cx="740" cy="142" r="25" fill="#0F172A" stroke="#818CF8" stroke-width="3"/>
      <circle cx="740" cy="142" r="8" fill="#818CF8">
        <animate attributeName="r" values="7;11;7" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="740" y="86" font-size="22" font-weight="700" fill="#E2E8F0">TEST</text>
      <text x="740" y="204" font-size="15" fill="#94A3B8">Check and refine</text>
    </g>

    <g>
      <circle cx="1000" cy="142" r="25" fill="#0F172A" stroke="#A78BFA" stroke-width="3"/>
      <circle cx="1000" cy="142" r="8" fill="#A78BFA">
        <animate attributeName="r" values="7;11;7" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="1000" y="86" font-size="22" font-weight="700" fill="#E2E8F0">IMPROVE</text>
      <text x="1000" y="204" font-size="15" fill="#94A3B8">Repeat with better choices</text>
    </g>
  </g>

  <!-- Moving indicator -->
  <circle cx="150" cy="142" r="8" fill="#FFFFFF" filter="url(#glow2)">
    <animate attributeName="cx" values="150;1050;150" dur="5.5s" repeatCount="indefinite"/>
  </circle>
</svg>
